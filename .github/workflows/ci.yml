name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Build the addon and load it. AppKit needs a window server, which a
  # hosted runner has (macOS runners run a real WindowServer session), so
  # this both compiles and confirms the module initialises — creating a
  # layer, laying out a line of CoreText, making an offscreen surface,
  # drawing a glyph run and checking it against the typesetter's output.
  build-test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 22, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - name: Load the addon and touch each subsystem
        run: |
          node -e "
            const m = require('.');
            const n = m.native ?? m;
            const s = n.createSurface(64, 48, 2);
            n.ctxSetFillColor(s, 1, 0, 0, 1);
            n.ctxFillRect(s, 0, 0, 64, 48);
            const px = n.ctxGetImageData(s, 10, 10, 1, 1);
            if (px[0] !== 255) { console.error('paint check failed', [...px.slice(0,4)]); process.exit(1); }
            const io = n.createSurfaceIOSurface(32, 32, 2, true);
            if (!(io.iosurfaceId > 0)) { console.error('iosurface id'); process.exit(1); }
            // glyph-level text: code point -> glyph id -> advance -> a run drawn
            // without a typesetter, pixel-identical to drawLayout of the same text
            const font = n.matchFont({ families: ['Menlo'], size: 13 });
            const ids = new Uint16Array([...'Hi'].map((c) => n.fontGlyphForCodepoint(font, c.codePointAt(0))));
            const adv = n.fontGlyphAdvances(font, ids);
            if (!(ids[0] > 0 && ids[1] > 0 && adv.length === 2 && adv[0] > 0)) { console.error('glyph lookup failed', [...ids], [...adv]); process.exit(1); }
            if (n.fontGlyphForCodepoint(font, 0x1F600) !== null || !n.fontFallbackFor(font, 0x1F600) || n.fontFallbackFor(font, 'H') !== font) { console.error('fallback face check failed'); process.exit(1); }
            // a shaped line reads back as the ids the cmap gave, a substituted face carries its own ids,
            // and a face at another size is the same face
            const shaped = n.fontShapeText(font, 'Hi');
            if (shaped.runs.length !== 1 || shaped.runs[0].font !== null || [...shaped.runs[0].glyphs].join() !== [...ids].join() || Math.abs(shaped.width - adv[0] - adv[1]) > 1e-6) { console.error('fontShapeText', shaped); process.exit(1); }
            const sub = n.fontShapeText(font, String.fromCodePoint(0x1F600)).runs[0];
            if (!sub || !sub.font || n.fontGlyphForCodepoint(sub.font, 0x1F600) !== sub.glyphs[0]) { console.error('fontShapeText substitution'); process.exit(1); }
            const big = n.fontWithSize(font, 26);
            if (n.fontMetrics(big).size !== 26 || n.fontMetrics(big).postScriptName !== n.fontMetrics(font).postScriptName || Math.abs(n.fontGlyphAdvances(big, ids)[0] - 2 * adv[0]) > 1e-6) { console.error('fontWithSize'); process.exit(1); }
            const paint = (draw) => { const g = n.createSurface(64, 48, 1); n.ctxSetFillColor(g, 1, 1, 1, 1); n.ctxFillRect(g, 0, 0, 64, 48); n.ctxSetFillColor(g, 0, 0, 0, 1); draw(g); return n.ctxGetImageData(g, 0, 0, 64, 48); };
            const layout = n.createLayout({ spans: [{ text: 'Hi', font }] });
            const viaLayout = paint((g) => n.drawLayout(g, layout.handle, 4, 30 - layout.lines[0].baseline));
            const viaGlyphs = paint((g) => n.ctxDrawGlyphs(g, [{ font, glyphs: ids, positions: new Float64Array([4, 30, 4 + adv[0], 30]) }]));
            if (!viaGlyphs.some((v) => v !== 255) || viaGlyphs.some((v, i) => v !== viaLayout[i])) { console.error('ctxDrawGlyphs does not match drawLayout'); process.exit(1); }
            // drag and drop: the hosting view answers a drag the way AppKit asks it — enter/over/drop through
            // the real NSDraggingDestination methods, the answer set from inside the callback for that event,
            // the payload read per item during the drop, and the OS's MIME table for the type names
            const dw = n.createWindow2({ width: 200, height: 150, title: 'dnd' });
            n.registerDropTypes(dw, ['public.utf8-plain-text']);
            const dndSeen = [];
            n.setBackendEventCallback((ev) => {
              if (!ev.type.startsWith('drag-')) return;
              dndSeen.push(ev.type);
              if (ev.type === 'drag-enter' || ev.type === 'drag-over') n.setDropResponse(dw, { accept: ev.types.includes('public.utf8-plain-text'), operation: 'copy' });
              if (ev.type === 'drag-perform') dndSeen.push(n.dragItemString(0, 'public.utf8-plain-text'));
            });
            const dndItems = [{ 'public.utf8-plain-text': 'hello' }];
            const dndAnswers = [n.postDragEvent(dw, 'enter', { x: 10, y: 10, items: dndItems }), n.postDragEvent(dw, 'over', { x: 12, y: 12, items: dndItems }), n.postDragEvent(dw, 'drop', { x: 12, y: 12, items: dndItems }), n.postDragEvent(dw, 'enter', { x: 1, y: 1, items: [{ 'public.png': Buffer.alloc(4) }] })];
            n.setBackendEventCallback(null);
            n.destroyWindow2(dw);
            if (dndAnswers.join() !== 'copy,copy,true,none' || dndSeen.join() !== 'drag-enter,drag-over,drag-perform,hello,drag-enter' || n.pasteboardTypeForMIME('image/png') !== 'public.png') { console.error('drag and drop', dndAnswers, dndSeen); process.exit(1); }
            // privacy (TCC) authorizations: every kind answers one of the four statuses without
            // prompting, automation only answers for a running target, and a bad shape is a TypeError
            const statuses = new Set(['authorized', 'denied', 'restricted', 'notDetermined']);
            for (const k of ['camera', 'microphone', 'screen-recording', 'accessibility', 'input-monitoring', 'location']) {
              const s = n.authorizationStatus(k);
              if (!statuses.has(s)) { console.error('authorizationStatus', k, s); process.exit(1); }
            }
            let finder; try { finder = n.authorizationStatus('automation', { target: 'com.apple.finder' }); } catch (e) { finder = e; }
            if (!statuses.has(finder) && !/not running/.test(finder && finder.message)) { console.error('automation status', finder); process.exit(1); }
            for (const bad of [() => n.authorizationStatus('bogus'), () => n.authorizationStatus('automation'), () => n.requestAuthorization('camera'), () => n.openPrivacySettings('bogus')]) {
              let err; try { bad(); } catch (e) { err = e; }
              if (!(err instanceof TypeError)) { console.error('expected a TypeError, got', err); process.exit(1); }
            }
            // app presence (#15): badge and policy read back, a dock menu round-trips through the
            // delegate the Dock calls and its activation arrives tagged menu:'dock', attention ids cancel
            n.initApp();
            const infoA = n.appInfo();
            if (infoA.activationPolicy !== 'regular' || infoA.dockBadge !== null) { console.error('appInfo', infoA); process.exit(1); }
            n.setDockBadge(3); if (n.appInfo().dockBadge !== '3') { console.error('dock badge'); process.exit(1); }
            n.setDockBadge(null); if (n.appInfo().dockBadge !== null) { console.error('dock badge clear'); process.exit(1); }
            let menuEv = null; n.setBackendEventCallback((ev) => { if (ev.type === 'menu-activate') menuEv = ev; });
            n.setDockMenu([{ id: 7, title: 'Open' }, { separator: true }, { id: 8, title: 'More', items: [{ id: 9, title: 'Deep' }] }]);
            const dm = n.dockMenuInfo();
            if (!dm || dm.items.length !== 3 || dm.items[2].submenu.items[0].id !== 9) { console.error('dockMenuInfo', JSON.stringify(dm)); process.exit(1); }
            if (!n.activateDockMenuItem([2, 0]) || !menuEv || menuEv.id !== 9 || menuEv.menu !== 'dock') { console.error('dock activation', menuEv); process.exit(1); }
            n.setDockMenu(null); if (n.dockMenuInfo() !== null) { console.error('dock menu clear'); process.exit(1); }
            const rid = n.requestUserAttention('informational'); if (typeof rid !== 'number') { console.error('attention id', rid); process.exit(1); } n.cancelUserAttention(rid);
            console.log('setAppName ->', n.setAppName('appkit-ci'), n.appInfo().name);
            console.log('appkit addon OK on', process.platform, process.arch, 'node', process.version);
          "

  # Same steps the release workflow uses to produce the prebuilt binaries
  # bundled into the npm tarball — run on every change so a broken pipeline
  # is discovered now, not at release time.
  prebuild:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install --build-from-source
      - name: Package the binaries as prebuilds (native arm64 + cross x64)
        run: |
          test "$(node -p process.arch)" = arm64   # the native build below is host-arch
          mkdir -p prebuilds/darwin-arm64 prebuilds/darwin-x64
          cp build/Release/calayers.node prebuilds/darwin-arm64/
          npx node-gyp rebuild --arch=x64
          cp build/Release/calayers.node prebuilds/darwin-x64/
          strip -x prebuilds/darwin-arm64/calayers.node prebuilds/darwin-x64/calayers.node   # -x: keep the exported symbols
          rm -rf build
          node -e "require('./index.js')"    # loads via the arm64 prebuild
          # the x64 slice cannot be load-tested on this arm64 runner; hold it
          # to the static checks instead
          test "$(lipo -archs prebuilds/darwin-arm64/calayers.node)" = arm64
          test "$(lipo -archs prebuilds/darwin-x64/calayers.node)" = x86_64
          # A prebuild that pulled in a Node library or a Homebrew/XQuartz
          # dylib would only load on the machine that built it. The addon
          # links nothing but system frameworks and libSystem/libc++.
          for f in prebuilds/darwin-arm64/calayers.node prebuilds/darwin-x64/calayers.node; do
            otool -L "$f"
            if otool -L "$f" | grep -qE 'libnode|/opt/homebrew|/usr/local/lib|/opt/X11'; then
              echo "prebuild links a non-system library — not portable"; exit 1
            fi
          done
          ls -la prebuilds/darwin-arm64 prebuilds/darwin-x64
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-darwin
          path: prebuilds/
          if-no-files-found: error
